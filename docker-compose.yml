services:

  mysql:
    image: mysql:8.0
    container_name: plasma-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: YourStrongPassword123!
      MYSQL_DATABASE: plasma_connect
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pYourStrongPassword123!"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: plasma-backend
    restart: always
    command: node docker-startup.js
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.docker
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: plasma-frontend
    restart: always
    ports:
      - "3001:80"
      - "3443:443"
    depends_on:
      - backend

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: plasma-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: YourStrongPassword123!
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
